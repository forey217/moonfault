name: Verify MoonFault
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.15+943464bfa'
          core-version: '0.10.15+943464bfa'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target wasm --deny-warn
      - run: moon test --target native --deny-warn
      - run: npm run verify
      - name: Install independent SCRAM oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y scram
      - name: Compare MEF exports, signed primes and risk factors with SCRAM
        run: python3 scripts/scram_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: moonfault-verification
          path: _build/reports/
